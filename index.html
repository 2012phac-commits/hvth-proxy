<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>HOANGTHUC KEY</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#050505;
    font-family:Arial,sans-serif;
    color:white;
}

.container{
    width:90%;
    max-width:380px;
    padding:25px;
    text-align:center;
    border:1px solid #00d9ff;
    border-radius:18px;
    background:rgba(0,20,35,.75);
    box-shadow:
        0 0 20px rgba(0,217,255,.35),
        inset 0 0 20px rgba(0,217,255,.08);
}

.title{
    font-size:24px;
    font-weight:900;
    color:#00d9ff;
    text-shadow:0 0 15px #00d9ff;
    margin-bottom:20px;
}

.key-box{
    width:100%;
    padding:17px 10px;
    border-radius:12px;
    border:1px solid #00d9ff;
    background:rgba(0,0,0,.7);
    font-size:16px;
    font-weight:bold;
    letter-spacing:1px;
    word-break:break-all;
    box-shadow:0 0 12px rgba(0,217,255,.25);
}

.copy-btn{
    width:100%;
    height:50px;
    margin-top:15px;
    border:0;
    border-radius:12px;
    background:linear-gradient(90deg,#006eff,#00d9ff);
    color:white;
    font-size:15px;
    font-weight:900;
    cursor:pointer;
    box-shadow:0 0 18px rgba(0,217,255,.4);
    transition:.2s;
}

.copy-btn:active{
    transform:scale(.95);
}

.success{
    margin-top:15px;
    min-height:20px;
    color:#00ffcc;
    font-size:13px;
    font-weight:bold;
    opacity:0;
    transition:.3s;
}

.success.show{
    opacity:1;
}
</style>
</head>

<body>

<div class="container">

    <div class="title">
        HOANGTHUC-KEY
    </div>

    <div class="key-box" id="key">
        key-hoangthuc-admin-7812
    </div>

    <button class="copy-btn" onclick="copyKey()">
        SAO CHÉP KEY
    </button>

    <div class="success" id="success">
        SAO CHÉP KEY THÀNH CÔNG ✓
    </div>

</div>

<script>
async function copyKey(){

    const key =
        document.getElementById("key").innerText.trim();

    try{

        await navigator.clipboard.writeText(key);

        document
            .getElementById("success")
            .classList.add("show");

        setTimeout(() => {
            document
                .getElementById("success")
                .classList.remove("show");
        },2500);

    }catch(error){

        /* Fallback cho trình duyệt không hỗ trợ Clipboard API */
        const textarea =
            document.createElement("textarea");

        textarea.value = key;
        textarea.style.position = "fixed";
        textarea.style.opacity = "0";

        document.body.appendChild(textarea);

        textarea.select();

        try{
            document.execCommand("copy");

            document
                .getElementById("success")
                .classList.add("show");

            setTimeout(() => {
                document
                    .getElementById("success")
                    .classList.remove("show");
            },2500);

        }catch(e){
            alert("Không thể sao chép key.");
        }

        document.body.removeChild(textarea);
    }
}
</script>

</body>
</html>
